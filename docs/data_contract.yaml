# Source chosen: customers.csv
# Suitability: This source is suitable for a basic contract because our profiling revealed actionable data quality issues (duplicates, missing emails) that a contract can enforce rules against.

dataset_name: customers
version: 1.0
owner: "unknown - requires confirmation"
source_type: file
source_format: csv
acquisition_method: File drop (SFTP/Cloud)
expected_update_pattern: Batch (Daily/Weekly)
primary_key: customer_id

schema:
  - name: customer_id
    type: string
    nullable: false
    description: Unique identifier for the customer
  - name: first_name
    type: string
    nullable: false
    description: Customer first name
  - name: last_name
    type: string
    nullable: false
    description: Customer last name
  - name: email
    type: string
    nullable: true
    description: Customer email address (can be missing)
  - name: city
    type: string
    nullable: true
    description: City of residence
  - name: signup_date
    type: date
    nullable: true
    description: The date the customer registered

quality_rules:
  - customer_id must not be null
  - customer_id must be unique
  - signup_date must be greater than or equal to 2000-01-01
  - email must contain an '@' symbol if not null

freshness_expectation: "unknown - requires confirmation"
duplicate_policy: deduplicate
schema_evolution_policy: reject if columns change
consumer: Data Warehouse / Downstream Analysts
notes: "Profiling revealed 2 fully duplicated rows and missing values in email and city. The ingestion pipeline must handle deduplication."